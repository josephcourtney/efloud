name: Apply dataset export acceptance hardening

on:
  push:
    branches:
      - close-dataset-export-acceptance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: close-dataset-export-acceptance
          persist-credentials: true
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Apply focused acceptance fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          export = Path("src/efloud/dataset_export.py")
          text = export.read_text()
          old = '''        not value
                  or path.is_absolute()
          '''
          new = '''        not value
                  or value == "."
                  or path.is_absolute()
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''        self.validate()
                  resolved_root = root.resolve(strict=True)
                  for member in self.members:
          '''
          new = '''        self.validate()
                  try:
                      resolved_root = root.resolve(strict=True)
                  except OSError:
                      return False
                  if not resolved_root.is_dir():
                      return False
                  for member in self.members:
          '''
          assert old in text
          text = text.replace(old, new, 1)
          export.write_text(text)

          api = Path("src/efloud/api.py")
          text = api.read_text()
          old = '''    ) -> ExportPlan:
                  manifest = self.manifest(paths=paths)
                  try:
                      return DatasetMaterializer(self._dataset.repository).plan(
                          manifest._manifest,
                          _path_for(destination),
                          strategy=strategy,
                      )
                  except (FileNotFoundError, FileExistsError, OSError, TypeError, ValueError) as exc:
                      raise ExportError(str(exc)) from exc
          '''
          new = '''    ) -> ExportPlan:
                  try:
                      manifest = self.manifest(paths=paths)
                      return DatasetMaterializer(self._dataset.repository).plan(
                          manifest._manifest,
                          _path_for(destination),
                          strategy=strategy,
                      )
                  except DatasetError as exc:
                      raise ExportError(str(exc)) from exc
                  except (FileNotFoundError, FileExistsError, OSError, TypeError, ValueError) as exc:
                      raise ExportError(str(exc)) from exc
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    ) -> DatasetManifest:
                  manifest = self.manifest(paths=paths)
                  try:
                      DatasetMaterializer(self._dataset.repository).export(
                          manifest._manifest,
                          _path_for(destination),
                          strategy=strategy,
                          dry_run=dry_run,
                      )
                  except (FileNotFoundError, FileExistsError, OSError, TypeError, ValueError) as exc:
                      raise ExportError(str(exc)) from exc
                  return manifest
          '''
          new = '''    ) -> DatasetManifest:
                  try:
                      manifest = self.manifest(paths=paths)
                      DatasetMaterializer(self._dataset.repository).export(
                          manifest._manifest,
                          _path_for(destination),
                          strategy=strategy,
                          dry_run=dry_run,
                      )
                  except DatasetError as exc:
                      raise ExportError(str(exc)) from exc
                  except (FileNotFoundError, FileExistsError, OSError, TypeError, ValueError) as exc:
                      raise ExportError(str(exc)) from exc
                  return manifest
          '''
          assert old in text
          text = text.replace(old, new, 1)
          api.write_text(text)

          tests = Path("tests/unit/test_dataset_export_public_acceptance.py")
          text = tests.read_text()
          text = text.replace(
              "from dataclasses import dataclass, field\nfrom typing import TYPE_CHECKING\n",
              "from dataclasses import dataclass, field\nfrom pathlib import Path\nfrom typing import TYPE_CHECKING\n",
              1,
          )
          text = text.replace(
              "if TYPE_CHECKING:\n    from pathlib import Path\n\npytestmark",
              "if TYPE_CHECKING:\n    pass\n\npytestmark",
              1,
          )
          text = text.replace(
              'with pytest.raises(DatasetError, match="Unsafe logical export path"):',
              'with pytest.raises(ExportError, match="Unsafe logical export path"):',
              1,
          )
          needle = '''        with pytest.raises(ExportError, match="Unsafe logical export path"):
                      dataset.export(tmp_path / "escape", paths={"source:example": "../escape"}, strategy="copy")
          '''
          replacement = needle + '''        with pytest.raises(ExportError, match="Unsafe logical export path"):
                      dataset.export(tmp_path / "dot", paths={"source:example": "."}, strategy="copy")
          '''
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = '''    metadata_before = (root / "metadata.sqlite").read_bytes()
              exported_member = export / json.loads(manifest.to_bytes())["members"][0]["path"]
          '''
          replacement = '''    metadata_before = (root / "metadata.sqlite").read_bytes()
              assert DatasetManifest.from_bytes(manifest.to_bytes()).verify(tmp_path / "missing-export") is False
              exported_member = export / json.loads(manifest.to_bytes())["members"][0]["path"]
          '''
          assert needle in text
          text = text.replace(needle, replacement, 1)
          needle = '''def test_generic_standard_library_consumer_validates_manifest_and_bytes(tmp_path: Path) -> None:
          '''
          addition = '''def test_linux_native_reflink_public_export_on_required_cow_filesystem() -> None:
              if not sys.platform.startswith("linux"):
                  pytest.skip("Linux-specific native reflink acceptance")
              configured = os.environ.get("EFLOUD_NATIVE_COW_TEST_ROOT")
              if configured is None:
                  pytest.skip("dedicated reflink-capable filesystem was not requested")
              workspace = Path(configured) / f"efloud-acceptance-{os.getpid()}"
              shutil.rmtree(workspace, ignore_errors=True)
              workspace.mkdir()
              try:
                  adapter = SequencedHttpAdapter((b"native reflink payload",))
                  with Repository.create(workspace / "repository") as repository:
                      _sync_http(repository, adapter, _http_source())
                      dataset = repository.datasets.freeze(DatasetSpec.latest("source:example"))
                      manifest = dataset.export(workspace / "export", strategy="reflink")
                      assert manifest.verify(workspace / "export")
              finally:
                  shutil.rmtree(workspace, ignore_errors=True)


          '''
          assert needle in text
          text = text.replace(needle, addition + needle, 1)
          tests.write_text(text)
          PY

      - name: Format changed Python
        run: uvx ruff@0.16.6 format src/efloud/api.py src/efloud/dataset_export.py tests/unit/test_dataset_export_public_acceptance.py

      - name: Commit focused changes and remove this workflow
        run: |
          git rm .github/workflows/apply-dataset-export-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/efloud/api.py src/efloud/dataset_export.py tests/unit/test_dataset_export_public_acceptance.py
          git commit -m "Harden public dataset export acceptance"
          git push origin HEAD:close-dataset-export-acceptance
