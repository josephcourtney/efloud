name: Apply durability audit

on:
  push:
    branches:
      - reverify-durability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fix durability test formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in (
              "tests/unit/test_phase14_17.py",
              "tests/unit/test_phase11_planning_execution.py",
          ):
              file = Path(path)
              text = file.read_text()
              marker = r"\n\ndef test_"
              if marker not in text:
                  raise SystemExit(f"{path}: malformed append marker not found")
              start = text.index(marker)
              prefix = text[:start]
              suffix = text[start:].replace(r"\n", "\n")
              file.write_text(prefix + suffix)
          PY
      - name: Commit corrected tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git diff --cached --check
          git commit -m "Fix durability regression formatting"
          git push
