name: Apply Review Fixes

on:
  push:
    branches:
      - repair/review-correctness-and-persistence

permissions:
  contents: write

concurrency:
  group: repair-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"

    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/review-correctness-and-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply repairs
        shell: bash
        run: |
          cat tools/.review-fix-gz/part-* | base64 --decode | gzip --decompress > /tmp/apply_review_fixes.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_review_fixes.py')
          text = path.read_text()
          text = text.replace(
              '    def recent_runs(self, *, limit: int = 50) -> tuple[RunRecord, ...]: ...\n    def start_operation(\n',
              '    def recent_runs(self, *, limit: int = 50) -> tuple[RunRecord, ...]: ...\n\n    def start_operation(\n',
          )
          text = text.replace(
              '    def recent_runs(self, *, limit: int = 50) -> tuple[RunRecord, ...]: ...\n    def operation(self, operation_id: OperationId) -> OperationRecord | None: ...\n\n    def start_operation(\n',
              '    def recent_runs(self, *, limit: int = 50) -> tuple[RunRecord, ...]: ...\n\n    def operation(self, operation_id: OperationId) -> OperationRecord | None: ...\n\n    def start_operation(\n',
          )
          text = text.replace(
              '        return tuple(self._observation_from_row(row) for row in rows)\n    def _latest_absence(\n',
              '        return tuple(self._observation_from_row(row) for row in rows)\n\n    def _latest_absence(\n',
          )
          text = text.replace(
              '    _set_version(connection, 3)\n\ndef initialize_or_migrate(connection: sqlite3.Connection) -> None:\n',
              '    _set_version(connection, 3)\n\n\ndef initialize_or_migrate(connection: sqlite3.Connection) -> None:\n',
          )
          old = """        '''            source_id=context.source_id,\n            observed_at=context.observed_at,\n            source_path=source_path,\n''',\n        '''            source_id=context.source_id,\n            inventory=inventory,\n            observed_at=context.observed_at,\n            source_path=source_path,\n''',"""
          new = """        '''        absence = context.repository.record_absence(\n            decision.artifact_key,\n            run_id=context.run_id,\n            operation_id=context.operation_id,\n            source_id=context.source_id,\n            observed_at=context.observed_at,\n            source_path=source_path,\n''',\n        '''        absence = context.repository.record_absence(\n            decision.artifact_key,\n            run_id=context.run_id,\n            operation_id=context.operation_id,\n            source_id=context.source_id,\n            inventory=inventory,\n            observed_at=context.observed_at,\n            source_path=source_path,\n''',"""
          if old not in text:
              raise SystemExit('rsync repair-script guard not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python /tmp/apply_review_fixes.py .

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Refresh lockfile
        run: uv lock

      - name: Sync development environment
        run: uv sync

      - name: Format changed Python
        run: uv run ruff format src/ tests/

      - name: Run canonical quality gate
        run: uv run just check

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden repository correctness and persistence"
          git push origin HEAD:repair/review-correctness-and-persistence
