name: Clean stale compatibility test references

on:
  push:
    branches: [remove-backwards-compatibility]
    paths:
      - .github/workflows/cleanup-stale-tests.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Remove compatibility-only assertions from retained tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_phase12_validation.py')
          text = path.read_text()
          text = text.replace('from efloud.repository_query import RepositoryQueryService\n', '')
          block = '''\n        payload = RepositoryQueryService(repository).query(f"content:{content.content_id}")\n        assert payload["available"] is True\n\n        serialized_validations = payload["validations"]\n        assert isinstance(serialized_validations, list)\n        assert len(serialized_validations) == 2\n'''
          if block not in text:
              raise SystemExit('phase12 query block not found')
          path.write_text(text.replace(block, ''))

          path = Path('tests/unit/test_phase8_provenance_derivation.py')
          text = path.read_text()
          for old in [
              'import asyncio\n',
              'from efloud.compat.repository_recording import RepositorySyncRecorder\n',
              'from efloud.models import EngineConfig, SyncResult\n',
              'from efloud.query import index_payload\n',
          ]:
              if old not in text:
                  raise SystemExit(f'phase8 import not found: {old!r}')
              text = text.replace(old, '')

          dry_start = text.index('def test_dry_run_import_creates_no_execution_operations')
          dry_end = text.index('\ndef test_content_derivation_reuses_content_with_fresh_observation_provenance', dry_start)
          text = text[:dry_start] + text[dry_end + 1:]

          text = text.replace(
              '        repo.finish_operation(operation_id, status="success", finished_at=3.0)\n',
              '        with pytest.raises(ValueError, match="Invalid terminal operation status"):\n'
              '            repo.finish_operation(operation_id, status="success", finished_at=3.0)\n'
              '        repo.finish_operation(operation_id, status="succeeded", finished_at=3.0)\n',
          )
          text = text.replace(
              '        repo.finish_run(run_id, status="success", finished_at=5.0)\n',
              '        with pytest.raises(ValueError, match="Invalid terminal run status"):\n'
              '            repo.finish_run(run_id, status="success", finished_at=5.0)\n'
              '        repo.finish_run(run_id, status="succeeded", finished_at=5.0)\n',
          )

          query_start = text.index('\n    cfg = EngineConfig(root=tmp_path, sources=[], derived_index_registry=indexes)')
          text = text[:query_start] + '\n'
          path.write_text(text)
          PY
          uvx ruff format tests/unit/test_phase12_validation.py tests/unit/test_phase8_provenance_derivation.py tests/unit/test_collection_repository_history.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_phase12_validation.py tests/unit/test_phase8_provenance_derivation.py tests/unit/test_collection_repository_history.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove stale compatibility references from retained tests"
          git push origin HEAD:remove-backwards-compatibility
