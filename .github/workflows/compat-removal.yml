name: Compatibility removal rewrite

on:
  push:
    branches: [remove-backwards-compatibility]
    paths:
      - .github/workflows/compat-removal.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Rewrite surviving compatibility boundaries
        run: python scripts/_compat_removal_pass.py
      - name: Format changed Python
        run: uvx ruff format src/efloud scripts/_compat_removal_pass.py
      - name: Commit rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/efloud
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Tighten canonical runtime after compatibility removal"
          git push origin HEAD:remove-backwards-compatibility
