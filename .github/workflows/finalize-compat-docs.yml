name: Finalize compatibility-removal documentation

on:
  push:
    branches: [remove-backwards-compatibility]
    paths:
      - .github/workflows/finalize-compat-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update maintained documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/api.md')
          text = path.read_text()
          old = '''This document defines the clean-break public API selected by ADR-0010. The current\nalpha implementation is being migrated to this surface; `STATUS.md` records what is\nimplemented today.\n'''
          new = '''This document defines the implemented clean-break public API selected by ADR-0010.\n`STATUS.md` records the current verification focus and remaining acceptance work.\n'''
          if old not in text:
              raise SystemExit('docs/api opening not found')
          path.write_text(text.replace(old, new))

          path = Path('docs/compatibility-inventory.md')
          text = path.read_text()
          old = '''ADR-0010 removes backwards compatibility as a requirement. This document is now a\nfinite deletion/replacement inventory: every listed alpha compatibility facility\nmust either disappear or be replaced by a canonical semantic equivalent. Nothing\nlisted here is retained merely because an old Efloud or BVP caller uses it.\n\nThe active execution queue is in `TODO.md`.\n'''
          new = '''ADR-0010 removed backwards compatibility as a requirement. This document is retained\nas the historical audit inventory used for the clean-break deletion. The maintained\nEfloud runtime no longer contains the alpha compatibility facilities listed below.\n\n**Efloud compatibility deletion completed: 2026-09-09.** Downstream BVP migration is\ntracked separately in `TODO.md` and is not a compatibility requirement for Efloud.\n'''
          if old not in text:
              raise SystemExit('compat inventory opening not found')
          text = text.replace(old, new)
          text = text.replace('## Finite removal checklist', '## Historical removal checklist')
          path.write_text(text)

          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [Unreleased]\n\n'
          entry = '''### Changed\n\n- Reject historical and non-empty unversioned repository schemas instead of migrating or partially interpreting them; require canonical terminal statuses and producer metadata.\n- Keep transport staging, HTTP cache, and rate-limit state under the explicitly non-authoritative `.efloud-runtime` operational root.\n\n### Removed\n\n- Remove all maintained alpha backwards-compatibility implementation, including `efloud.compat`, deprecated `sync(cfg)`, `EngineConfig`, merged manifests and mirror-state projections, old source/fanout/derived contracts, query/status/health/summary facades, aliases/adoption, path materialization helpers, TTL cache/index compatibility, and historical schema migrations.\n- Remove compatibility-only tests and architecture exceptions; installed-wheel contracts now require the deleted modules to be absent and unimportable.\n\n'''
          if marker not in text:
              raise SystemExit('CHANGELOG Unreleased marker not found')
          if 'Remove all maintained alpha backwards-compatibility implementation' not in text:
              text = text.replace(marker, marker + entry, 1)
          path.write_text(text)
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/api.md docs/compatibility-inventory.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Document completed compatibility removal"
          git push origin HEAD:remove-backwards-compatibility
