name: Apply dataset export lint cleanup

on:
  push:
    branches:
      - close-dataset-export-acceptance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: close-dataset-export-acceptance
          persist-credentials: true
          fetch-depth: 0

      - name: Apply lint cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          export = Path("src/efloud/dataset_export.py")
          text = export.read_text()
          old = '''    path = PurePosixPath(value)
              if (
                  not value
                  or value == "."
                  or path.is_absolute()
                  or path.as_posix() != value
                  or any(part in {".", ".."} or part.endswith((".", " ")) for part in path.parts)
                  or any(char in "\\\\:\\x00" or ord(char) < _CONTROL_CHARACTER_LIMIT for char in value)
              ):
          '''
          new = '''    path = PurePosixPath(value)
              unsafe_shape = not value or value == "." or path.is_absolute() or path.as_posix() != value
              unsafe_component = any(part in {".", ".."} or part.endswith((".", " ")) for part in path.parts)
              unsafe_character = any(char in "\\\\:\\x00" or ord(char) < _CONTROL_CHARACTER_LIMIT for char in value)
              if unsafe_shape or unsafe_component or unsafe_character:
          '''
          assert old in text
          export.write_text(text.replace(old, new, 1))

          tests = Path("tests/unit/test_dataset_export_public_acceptance.py")
          text = tests.read_text()
          text = text.replace("import errno\n", "", 1)
          text = text.replace("from typing import TYPE_CHECKING\n", "", 1)
          text = text.replace("\nif TYPE_CHECKING:\n    pass\n", "", 1)
          tests.write_text(text)
          PY

      - name: Commit cleanup and remove this workflow
        run: |
          git rm .github/workflows/fix-dataset-export-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/efloud/dataset_export.py tests/unit/test_dataset_export_public_acceptance.py
          git commit -m "Clean dataset export acceptance lint"
          git push origin HEAD:close-dataset-export-acceptance
