name: Fix issue 21

on:
  push:
    branches:
      - fix-selective-adapter-version

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
      UV_LOCKED: "true"
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix-selective-adapter-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Sync locked development environment
        run: |
          uv sync
          uv pip install cryptography

      - name: Apply focused repair and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          project_path = Path("src/efloud/project.py")
          text = project_path.read_text()
          old = '''            decision = decisions.get(source.id)\n            actual = None if decision is None else decision.adapter_version\n            if actual != source.adapter_version:\n'''
          new = '''            decision = decisions.get(source.id)\n            if decision is not None and not decision.selected:\n                continue\n            actual = None if decision is None else decision.adapter_version\n            if actual != source.adapter_version:\n'''
          if old not in text:
              raise SystemExit("adapter-version validation target not found")
          project_path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/unit/test_project_declaration.py")
          tests = test_path.read_text()
          marker = "def test_project_sync_lock_roundtrip_and_detached_source_resolution"
          if marker not in tests:
              raise SystemExit("test insertion marker not found")
          addition = '''def _selective_version_project(\n    tmp_path: Path,\n    *,\n    selected_version: str = "1",\n    unselected_version: str = "999",\n) -> Project:\n    (tmp_path / "selected.txt").write_text("selected", encoding="utf-8")\n    (tmp_path / "unselected.txt").write_text("unselected", encoding="utf-8")\n    return Project.from_toml(\n        f"""\n        schema_version = 1\n        [sync]\n        source_ids = ["selected"]\n        dry_run = true\n\n        [[sources]]\n        id = "selected"\n        adapter = "efloud:local"\n        adapter_version = "{selected_version}"\n        [sources.config]\n        path = "selected.txt"\n\n        [[sources]]\n        id = "unselected"\n        adapter = "efloud:local"\n        adapter_version = "{unselected_version}"\n        [sources.config]\n        path = "unselected.txt"\n        """,\n        base_dir=tmp_path,\n    )\n\n\ndef test_selective_project_version_validation_ignores_unselected_sources(tmp_path: Path) -> None:\n    project = _selective_version_project(tmp_path)\n    with Repository.create(tmp_path / "repository") as repository:\n        plan = project.plan(repository)\n        decisions = {item.source_id: item for item in plan.decisions}\n        assert decisions["selected"].selected\n        assert decisions["selected"].adapter_version == "1"\n        assert not decisions["unselected"].selected\n        assert decisions["unselected"].adapter_version is None\n\n        result = asyncio.run(project.sync(repository))\n        assert result.ok\n\n\ndef test_selective_project_version_validation_still_fails_for_selected_mismatch(tmp_path: Path) -> None:\n    project = _selective_version_project(tmp_path, selected_version="999", unselected_version="1")\n    with Repository.create(tmp_path / "repository") as repository:\n        with pytest.raises(ProjectError, match="declaration requires '999'"):\n            project.plan(repository)\n        with pytest.raises(ProjectError, match="declaration requires '999'"):\n            asyncio.run(project.sync(repository))\n\n\n'''
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests)

          changelog = Path("CHANGELOG.md")
          log = changelog.read_text()
          fixed = "### Fixed\n\n"
          entry = "- Ignore declared adapter-version constraints for sources explicitly unselected by a selective project plan while continuing to fail closed for selected version mismatches.\n"
          if entry not in log:
              if fixed not in log:
                  raise SystemExit("CHANGELOG Fixed section not found")
              log = log.replace(fixed, fixed + entry, 1)
              changelog.write_text(log)
          PY

      - name: Format changed and pre-existing declarative Python files
        run: >-
          uv run ruff format
          src/efloud/project.py
          src/efloud/lockfile.py
          tests/unit/test_project_declaration.py

      - name: Run focused regression tests
        run: >-
          uv run pytest
          tests/unit/test_project_declaration.py::test_selective_project_version_validation_ignores_unselected_sources
          tests/unit/test_project_declaration.py::test_selective_project_version_validation_still_fails_for_selected_mismatch

      - name: Run canonical gate
        run: uv run just check

      - name: Remove repair workflow
        run: rm .github/workflows/fix-issue-21.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/efloud/project.py src/efloud/lockfile.py tests/unit/test_project_declaration.py CHANGELOG.md .github/workflows/fix-issue-21.yml
          git commit -m "Fix selective project adapter version validation"
          git push origin HEAD:fix-selective-adapter-version
