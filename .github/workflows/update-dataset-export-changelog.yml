name: Update dataset export changelog

on:
  push:
    branches:
      - close-dataset-export-acceptance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: close-dataset-export-acceptance
          persist-credentials: true
          fetch-depth: 0

      - name: Update changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "### Changed\n\n"
          addition = (
              "- Close dataset/export acceptance through the clean public API: verify resolve-versus-freeze semantics, "
              "frozen historical evidence, incomplete-snapshot behavior, detached handoff, missing/corrupt content, "
              "safe exclusive publication, and a standard-library-only manifest consumer.\n"
              "- Exercise explicit Linux reflink export on a reflink-enabled XFS CI filesystem and atomic "
              "`renameat2(RENAME_NOREPLACE)` publication; document detached dataset manifest v1 as a repository-independent contract.\n"
              "- Reject `.` as an export member path, return `False` when detached verification has no usable root, "
              "and report public manifest-layout export failures consistently as `ExportError`.\n"
          )
          assert marker in text
          assert addition not in text
          path.write_text(text.replace(marker, marker + addition, 1))
          PY

      - name: Commit changelog and remove this workflow
        run: |
          git rm .github/workflows/update-dataset-export-changelog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Record dataset export acceptance"
          git push origin HEAD:close-dataset-export-acceptance
