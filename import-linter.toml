# import-linter.toml
#
# Active contracts for the compatibility-free repository-centered architecture.
# Historical/deleted modules are asserted absent by packaging tests rather than
# named here as architectural participants.
#
[tool.importlinter]
  root_package              = "efloud"
  include_external_packages = false

[[tool.importlinter.contracts]]
  name = "repository models stay below orchestration"
  type = "forbidden"
  source_modules = ["efloud.repository_models"]
  forbidden_modules = [
    "efloud.engine",
    "efloud.executor",
    "efloud.planner",
  ]

[[tool.importlinter.contracts]]
  name = "storage stays below orchestration"
  type = "forbidden"
  source_modules = [
    "efloud.blob_store",
    "efloud.metadata_store",
    "efloud.schema",
    "efloud.schema_migrations",
    "efloud.sqlite_metadata",
  ]
  forbidden_modules = [
    "efloud.engine",
    "efloud.executor",
    "efloud.planner",
  ]

[[tool.importlinter.contracts]]
  name = "datasets do not depend on mutable repository"
  type = "forbidden"
  source_modules = [
    "efloud.datasets",
    "efloud.dataset_selectors",
    "efloud.dataset_constraints",
    "efloud.dataset_export",
    "efloud.materialization",
  ]
  forbidden_modules = ["efloud.repository"]

[[tool.importlinter.contracts]]
  name = "planning does not depend on execution"
  type = "forbidden"
  source_modules = [
    "efloud.planning",
    "efloud.planner",
  ]
  forbidden_modules = [
    "efloud.engine",
    "efloud.executor",
  ]

[[tool.importlinter.contracts]]
  name = "adapters do not depend on orchestration"
  type = "forbidden"
  source_modules = [
    "efloud.adapters",
    "efloud.collection_adapter",
    "efloud.http_adapter",
    "efloud.rsync_adapter",
  ]
  forbidden_modules = [
    "efloud.engine",
    "efloud.executor",
  ]
