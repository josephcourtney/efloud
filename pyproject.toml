# =================================== project ====================================
[project]
  name = "efloud"
  version = "0.3.0"
  description = "Local versioned data ingestion and immutable artifact repositories"
  readme = "README.md"
  authors = [
    { name = "Joseph M Courtney", email = "5942706+josephcourtney@users.noreply.github.com" },
  ]
  urls = { "Homepage" = "https://github.com/josephcourtney/efloud", "Bug Tracker" = "https://github.com/josephcourtney/efloud/issues" }
  license = "GPL-3.0-only"
  license-files = ["LICENSE.md"]
  classifiers = []
  requires-python = ">=3.12,<3.15"
  dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
  ]

  # [project.scripts]
  #   efloud = "efloud.cli:cli"

[project.optional-dependencies]
  signing = ["cryptography>=50.0.1"]

[dependency-groups]
  dev = [
    "cryptography>=50.0.1",  # needed to run Ed25519 signing tests
    "pytest-asyncio>=1.3.0",
    "coverage>=7.13.4",
    "freezegun>=1.5.5",
    "hypothesis>=6.151.9",
    "import-linter>=2.10",
    "mutmut>=3.4.0",
    "pyfakefs>=6.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.0.1",
    "pytest-regressions>=2.10.0",
    "pytest-subprocess>=1.5.3",
    "pytest-test-categories>=1.2.1",
    "pytest-testmon>=2.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.2",
    "radon>=6.0.1",
    "rope>=1.14.0",
    "ruff>=0.15.2",
    "rust-just>=1.46.0",
    "showcov>=0.3.5",
    "ty>=0.0.17",
    "vulture>=2.14",
    "watchdog>=6.0.0",
  ]

# =================================== build ====================================
  requires      = ["uv_build>=0.12.0,<0.13.0"]
  build-backend = "uv_build"
[tool.uv]

  [tool.uv.sources]
    showcov = { git = "https://github.com/josephcourtney/showcov.git", rev = "main" }
